<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Catalogue Portal</h1>
            <p class="subtitle">Manage your product catalogue with quantity tracking</p>
        </header>

        <div class="main-content">
            <!-- Add Item Form -->
            <section class="add-item-section">
                <h2>Add New Item</h2>
                <form id="addItemForm">
                    <div class="form-group">
                        <label for="itemName">Product Name</label>
                        <input type="text" id="itemName" required placeholder="Enter product name">
                    </div>
                    <div class="form-group">
                        <label for="itemDescription">Description</label>
                        <textarea id="itemDescription" rows="3" required placeholder="Enter product description"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="itemPrice">Price ($)</label>
                            <input type="number" id="itemPrice" step="0.01" min="0" required placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label for="itemQuantity">Quantity</label>
                            <input type="number" id="itemQuantity" min="0" required placeholder="0">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Item</button>
                </form>
            </section>

            <!-- Catalogue Display -->
            <section class="catalogue-section">
                <div class="section-header">
                    <h2>Product Catalogue</h2>
                    <div class="stats">
                        <span>Total Items: <strong id="totalItems">0</strong></span>
                        <span>Total Stock: <strong id="totalStock">0</strong></span>
                    </div>
                </div>
                <div id="catalogueList" class="catalogue-list">
                    <!-- Catalogue items will be dynamically added here -->
                </div>
            </section>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Edit Item</h2>
            <form id="editItemForm">
                <input type="hidden" id="editItemId">
                <div class="form-group">
                    <label for="editItemName">Product Name</label>
                    <input type="text" id="editItemName" required>
                </div>
                <div class="form-group">
                    <label for="editItemDescription">Description</label>
                    <textarea id="editItemDescription" rows="3" required></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="editItemPrice">Price ($)</label>
                        <input type="number" id="editItemPrice" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="editItemQuantity">Quantity</label>
                        <input type="number" id="editItemQuantity" min="0" required>
                    </div>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <button type="button" class="btn btn-secondary" id="cancelEdit">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
